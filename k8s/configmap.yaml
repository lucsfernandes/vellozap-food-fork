apiVersion: v1
kind: ConfigMap
metadata:
  name: vellozap-food-config
  namespace: vellozap-food
  labels:
    app.kubernetes.io/name: vellozap-food
    app.kubernetes.io/part-of: arcobatrox
data:
  # NOTE: This value is here for documentation only. Vite reads VITE_API_URL at
  # BUILD time via `import.meta.env`, so a runtime ConfigMap cannot change what
  # the SPA bundle calls. The real value is baked into the image via the
  # Dockerfile ARG (passed at CI build time, e.g.
  # --build-arg VITE_API_URL=https://api.vellozap-food.arcobatrox.com.br/api).
  #
  # The SPA runs in the user's browser — it CANNOT reach *.svc.cluster.local
  # addresses. Use the public API URL.
  VITE_API_URL: "https://api.vellozap-food.arcobatrox.com.br/api"
