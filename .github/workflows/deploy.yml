name: CI/CD Frontend Deploy to VPS with K8s

on:
  push:
   branches:
    - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: Resolve image name
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
        run: |
          # Docker references must be lowercase [a-z0-9._-]; normalize and validate.
          user="$(printf '%s' "$DOCKERHUB_USER" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [ -z "$user" ]; then
            echo "::error::DOCKERHUB_USER secret is empty. Set it in the repository secrets."
            exit 1
          fi
          echo "IMAGE_NAME=${user}/vellozap-food:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        env:
          # VITE_API_URL is inlined into the SPA bundle at BUILD time, so it must
          # be passed as a build-arg here (a runtime ConfigMap cannot change it).
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          docker build \
            --build-arg VITE_API_URL="${VITE_API_URL}" \
            -t "$IMAGE_NAME" .
          docker push "$IMAGE_NAME"

      - name: Prepare kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_DATA" | base64 --decode > $HOME/.kube/config

      - name: Criar namespace se não existir
        run: |
          kubectl get namespace vellozap-food || kubectl create namespace vellozap-food

      - name: Replace image placeholder
        run: |
          # IMAGE_NAME comes from the "Resolve image name" step via $GITHUB_ENV.
          sed -i "s|REPLACE_IMAGE|${IMAGE_NAME}|g" k8s/deployment.yaml

      - name: kubectl apply
        run: |
          kubectl apply -k k8s
